[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myelin"
version = "0.1.0"
description = "Cognitive memory layer for AI agents. Learns procedures from behavior, transfers knowledge across agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nino", email = "nino@niraven.dev" },
]
keywords = ["ai", "agents", "memory", "mcp", "cognitive-architecture", "procedural-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "sqlite-vec>=0.1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2.0",
]
api-embeddings = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.scripts]
myelin = "myelin.server:main"

[project.urls]
Homepage = "https://github.com/Niraven/myelin"
Repository = "https://github.com/Niraven/myelin"
Issues = "https://github.com/Niraven/myelin/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/myelin"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
